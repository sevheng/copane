name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # OpenTUI's native library with copane's patch (scripts/opentui-native.sh); cached per patch.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/copane/opentui-native
          key: opentui-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/opentui-native@*.patch', 'bun.lock') }}
      - run: sh scripts/opentui-native.sh
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
